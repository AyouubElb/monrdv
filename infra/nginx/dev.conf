# Local mirror of the production proxy: every subdomain of localhost reaches the same apps,
# which run on the host with `pnpm dev` (web on 3000, API on 3001).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  server_name localhost *.localhost;

  # Keep every proxy_set_header at this level: a location that sets even one
  # inherits none of these, and would silently drop Host.
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Next.js hot reload uses a websocket.
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;

  location /api/ {
    proxy_pass http://host.docker.internal:3001;
  }

  location / {
    proxy_pass http://host.docker.internal:3000;
  }
}
