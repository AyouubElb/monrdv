# Lint, typecheck, test, and build on every push and pull request. Any failure fails the run.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      db-test:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_DB: booking_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      TEST_DATABASE_URL: postgresql://app_user:user_ci@localhost:5433/booking_test
      TEST_MIGRATE_DATABASE_URL: postgresql://app_migrator:migrator_ci@localhost:5433/booking_test
      NEXT_PUBLIC_ROOT_DOMAIN: localhost
      TURBO_TELEMETRY_DISABLED: '1'
      PRISMA_HIDE_UPDATE_MESSAGE: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check time zone data
        run: node -p "process.versions.tz"

      - run: pnpm install --frozen-lockfile

      - name: Create database roles (same script as the local containers)
        run: sh infra/postgres/init/01-roles.sh
        env:
          PGHOST: localhost
          PGPORT: '5433'
          PGPASSWORD: postgres_ci
          POSTGRES_USER: postgres
          POSTGRES_DB: booking_test
          APP_MIGRATOR_PASSWORD: migrator_ci
          APP_USER_PASSWORD: user_ci

      - name: Format
        run: pnpm format:check

      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build
